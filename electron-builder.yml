appId: com.myphdos.app
productName: My PhD OS
copyright: Copyright © 2026 My PhD OS contributors
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!docs/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig,CHANGELOG.md,README.md,prompt.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts,playwright.config.ts}'
  - '!{coverage,playwright-report,test-results}'
# node:sqlite is a Node built-in shipped inside Electron: nothing native to unpack or rebuild.
asarUnpack:
  - 'resources/**'
npmRebuild: false
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  # Ad-hoc signature. There is no paid Developer ID, but every nested binary still has to be signed
  # or Apple Silicon refuses to run the app at all ("damaged and can't be opened"). This does not
  # remove Gatekeeper's first-launch prompt on a downloaded copy — only notarisation would.
  identity: '-'
  hardenedRuntime: false
  notarize: false
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${name}-${version}-${arch}.${ext}
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  executableName: My PhD OS
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
linux:
  target:
    - AppImage
  category: Office
  maintainer: My PhD OS contributors
appImage:
  artifactName: ${name}-${version}.${ext}
